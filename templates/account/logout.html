{% load i18n %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerrar sesión · HuertoSmart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'verde-oscuro': '#1B4332',
                        'verde-medio': '#2D6A4F',
                        'verde-suave': '#B7E4C7',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-950 min-h-screen flex flex-col items-center justify-center px-4">

    <a href="/" class="mb-8 text-2xl font-bold text-white flex items-center gap-2 hover:text-verde-suave transition">
        🌱 HuertoSmart
    </a>

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8 text-center">
        <p class="text-5xl mb-4">👋</p>
        <h1 class="text-2xl font-bold text-gray-900 mb-2">¿Cerrar sesión?</h1>
        <p class="text-gray-500 text-sm mb-6">Hasta pronto, {{ user.username }}.</p>

        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            <button type="submit"
                    class="w-full bg-verde-medio hover:bg-verde-oscuro text-white font-semibold py-3 rounded-lg transition mb-3">
                Sí, cerrar sesión
            </button>
        </form>

        <a href="/" class="block w-full border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold py-3 rounded-lg transition">
            Cancelar
        </a>
    </div>

    <p class="mt-6 text-gray-600 text-xs">HuertoSmart · MEDAC/Davante 2026</p>

</body>
</html>
